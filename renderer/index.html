  <!-- ===== 最前置错误捕获：在任意 JS 加载之前注册 ===== -->
  <script>
    window.__earlyErrors = [];
    window.onerror = function(msg, url, line, col, err) {
      window.__earlyErrors.push({
        type: 'onerror',
        message: msg,
        url: url, line: line, col: col,
        stack: err && err.stack ? err.stack : ''
      });
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      window.__earlyErrors.push({
        type: 'unhandledrejection',
        message: e.reason ? (e.reason.message || String(e.reason)) : 'unknown',
        stack: e.reason && e.reason.stack ? e.reason.stack : ''
      });
    });
  </script>

  <!-- 上报 JS 早期加载阶段捕获的错误 -->
  <script>
    (function() {
      if (window.__earlyErrors && window.__earlyErrors.length) {
        try {
          window.__earlyErrors.forEach(function(err) {
            window.narrative.logCrash(err);
          });
        } catch(e) {}
      }
      // 清除已上报的错误
      window.__earlyErrors = [];
    })();

    // 模型快速切换器
    window.切换模型 = function(val) {
      if (!val) return;
      var configs = (window.LLMService && LLMService.getAll()) || [];
      for (var i = 0; i < configs.length; i++) {
        if (configs[i].id === val) {
          S.currentModel = configs[i].model;
          S.settings.defaultModel = configs[i].id;
          break;
        }
      }
      if (typeof saveSettings === 'function') saveSettings(S.settings);
      var _label = configs[i] ? (configs[i].name || configs[i].model) : val;
      toast('已切换至: ' + _label);
    };

    window.updateModelSwitcher = function() {
      var sel = document.getElementById('modelSwitcher');
      if (!sel) return;
      var configs = (window.LLMService && LLMService.getAll()) || [];
      // 从 settings.defaultModel 恢复当前配置 ID
      if (!S.settings.defaultModel && configs.length) {
        S.settings.defaultModel = configs[0].id;
      }
      var currentId = S.settings.defaultModel || '';
      sel.innerHTML = '';
      if (!configs.length) {
        sel.innerHTML = '<option value="">无配置</option>';
        return;
      }
      var matched = false;
      for (var i = 0; i < configs.length; i++) {
        var opt = document.createElement('option');
        opt.value = configs[i].id;
        opt.textContent = (configs[i].name || configs[i].model) + ' (' + configs[i].model + ')';
        if (configs[i].id === currentId) { opt.selected = true; matched = true; S.currentModel = configs[i].model; }
        sel.appendChild(opt);
      }
      if (!matched && configs.length) {
        S.currentModel = configs[0].model;
        S.settings.defaultModel = configs[0].id;
        if (sel.options && sel.options[0]) sel.options[0].selected = true;
      }
    };

    // 在 LLMService 方法后自动刷新 switcher
    (function() {
      var _origAdd = window.LLMService && LLMService.add;
      var _origUpdate = window.LLMService && LLMService.update;
      var _origRemove = window.LLMService && LLMService.remove;
      if (_origAdd) LLMService.add = function(config) {
        var r = _origAdd.call(this, config);
        setTimeout(updateModelSwitcher, 50);
        return r;
      };
      if (_origUpdate) LLMService.update = function(id, updates) {
        _origUpdate.call(this, id, updates);
        setTimeout(updateModelSwitcher, 50);
      };
      if (_origRemove) LLMService.remove = function(id) {
        _origRemove.call(this, id);
        setTimeout(updateModelSwitcher, 50);
      };
    })();

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', updateModelSwitcher);
    } else {
      updateModelSwitcher();
    }
  </script>
